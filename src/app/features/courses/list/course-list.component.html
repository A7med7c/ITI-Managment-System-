<div class="d-flex justify-content-between align-items-center mb-3">
  <h2 class="h4 mb-0">Courses</h2>
  <a routerLink="/courses/new" class="btn btn-primary">Add New</a>
</div>

<div *ngIf="errorMessage" class="alert alert-danger" role="alert">
  {{ errorMessage }}
</div>

<div *ngIf="successMessage" class="alert alert-success" role="alert">
  {{ successMessage }}
</div>

<div *ngIf="loading" class="text-center py-4">
  <div class="spinner-border" role="status" aria-hidden="true"></div>
</div>

<div *ngIf="!loading" class="table-responsive">
  <table class="table table-striped table-bordered align-middle">
    <thead class="table-light">
      <tr>
        <th scope="col">ID</th>
        <th scope="col">Course Name</th>
        <th scope="col">Department</th>
        <th scope="col" class="text-center">Actions</th>
      </tr>
    </thead>
    <tbody>
      <tr *ngFor="let course of courses">
        <td>{{ course.courseId }}</td>
        <td>{{ course.courseName }}</td>
        <td>{{ course.departmentName || 'N/A' }}</td>
        <td class="text-center">
          <a [routerLink]="['/courses', course.courseId, 'edit']" class="btn btn-sm btn-warning me-2">Edit</a>
          <button class="btn btn-sm btn-danger" (click)="deleteCourse(course.courseId)">Delete</button>
        </td>
      </tr>
      <tr *ngIf="courses.length === 0">
        <td colspan="4" class="text-center">No courses found.</td>
      </tr>
    </tbody>
  </table>
</div>
