<div class="d-flex justify-content-between align-items-center mb-3">
  <h2 class="h4 mb-0">{{ isEditMode ? 'Edit Course' : 'Add Course' }}</h2>
</div>

<div *ngIf="errorMessage" class="alert alert-danger" role="alert">
  {{ errorMessage }}
</div>

<div *ngIf="successMessage" class="alert alert-success" role="alert">
  {{ successMessage }}
</div>

<div *ngIf="loading" class="text-center py-4">
  <div class="spinner-border" role="status" aria-hidden="true"></div>
</div>

<div *ngIf="!loading" class="card">
  <div class="card-body">
    <form [formGroup]="form" (ngSubmit)="onSubmit()" novalidate>
      <div class="row g-3">
        <div class="col-12 col-md-6" *ngIf="!isEditMode">
          <label for="courseId" class="form-label">Course ID</label>
          <input id="courseId" type="number" class="form-control" formControlName="courseId" />
          <div *ngIf="form.controls.courseId.touched && form.controls.courseId.invalid" class="text-danger small mt-1">
            Course ID is required.
          </div>
        </div>

        <div class="col-12 col-md-6">
          <label for="courseName" class="form-label">Course Name</label>
          <input id="courseName" type="text" class="form-control" formControlName="courseName" />
          <div *ngIf="form.controls.courseName.touched && form.controls.courseName.invalid"
            class="text-danger small mt-1">
            Course name is required.
          </div>
        </div>

        <div class="col-12 col-md-6">
          <label for="departmentId" class="form-label">Department</label>
          <select id="departmentId" class="form-select" formControlName="departmentId">
            <option [ngValue]="null">Select department</option>
            <option *ngFor="let department of departments" [ngValue]="department.deptId">
              {{ department.deptName }}
            </option>
          </select>
          <div *ngIf="form.controls.departmentId.touched && form.controls.departmentId.invalid"
            class="text-danger small mt-1">
            Department is required.
          </div>
        </div>
      </div>

      <div class="mt-4 d-flex gap-2">
        <button class="btn btn-primary" type="submit">{{ isEditMode ? 'Update' : 'Create' }}</button>
        <button class="btn btn-secondary" type="button" (click)="onCancel()">Cancel</button>
      </div>
    </form>
  </div>
</div>
