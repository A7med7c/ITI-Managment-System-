<div class="row justify-content-center">
  <div class="col-12 col-md-6 col-lg-5">
    <div class="card">
      <div class="card-body">
        <h2 class="h4 mb-3">Register</h2>

        <div *ngIf="errorMessage" class="alert alert-danger" role="alert">
          {{ errorMessage }}
        </div>

        <div *ngIf="successMessage" class="alert alert-success" role="alert">
          {{ successMessage }}
        </div>

        <form [formGroup]="form" (ngSubmit)="onSubmit()" novalidate>
          <div class="mb-3">
            <label for="userName" class="form-label">Username</label>
            <input id="userName" type="text" class="form-control" formControlName="userName" />
            <div *ngIf="form.controls.userName.touched && form.controls.userName.invalid"
              class="text-danger small mt-1">
              Username is required and must be at least 3 characters.
            </div>
          </div>

          <div class="mb-3">
            <label for="displayName" class="form-label">Display Name</label>
            <input id="displayName" type="text" class="form-control" formControlName="displayName" />
            <div *ngIf="form.controls.displayName.touched && form.controls.displayName.invalid"
              class="text-danger small mt-1">
              Display name is required.
            </div>
          </div>

          <div class="mb-3">
            <label for="email" class="form-label">Email</label>
            <input id="email" type="email" class="form-control" formControlName="email" />
            <div *ngIf="form.controls.email.touched && form.controls.email.invalid" class="text-danger small mt-1">
              Please enter a valid email.
            </div>
          </div>

          <div class="mb-3">
            <label for="phoneNumber" class="form-label">Phone Number</label>
            <input id="phoneNumber" type="tel" class="form-control" formControlName="phoneNumber" />
            <div *ngIf="form.controls.phoneNumber.touched && form.controls.phoneNumber.invalid"
              class="text-danger small mt-1">
              Please enter a valid phone number.
            </div>
          </div>

          <div class="mb-3">
            <label for="password" class="form-label">Password</label>
            <input id="password" type="password" class="form-control" formControlName="password" />
            <div *ngIf="form.controls.password.touched && form.controls.password.invalid"
              class="text-danger small mt-1">
              Password is required and must be at least 6 characters.
            </div>
          </div>

          <button class="btn btn-success w-100" type="submit" [disabled]="loading">
            <span *ngIf="loading" class="spinner-border spinner-border-sm me-2" aria-hidden="true"></span>
            Create Account
          </button>
        </form>

        <p class="mt-3 mb-0 text-center">
          Already have an account?
          <a routerLink="/login">Login</a>
        </p>
      </div>
    </div>
  </div>
</div>
