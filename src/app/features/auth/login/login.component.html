<div class="row justify-content-center">
  <div class="col-12 col-md-6 col-lg-4">
    <div class="card">
      <div class="card-body">
        <h2 class="h4 mb-3">Login</h2>

        <div *ngIf="errorMessage" class="alert alert-danger" role="alert">
          {{ errorMessage }}
        </div>

        <form [formGroup]="form" (ngSubmit)="onSubmit()" novalidate>
          <div class="mb-3">
            <label for="email" class="form-label">Email</label>
            <input id="email" type="email" class="form-control" formControlName="email" />
            <div
              *ngIf="form.controls.email.touched && form.controls.email.invalid"
              class="text-danger small mt-1"
            >
              Please enter a valid email.
            </div>
          </div>

          <div class="mb-3">
            <label for="password" class="form-label">Password</label>
            <input id="password" type="password" class="form-control" formControlName="password" />
            <div
              *ngIf="form.controls.password.touched && form.controls.password.invalid"
              class="text-danger small mt-1"
            >
              Password is required and must be at least 6 characters.
            </div>
          </div>

          <button class="btn btn-primary w-100" type="submit" [disabled]="loading">
            <span *ngIf="loading" class="spinner-border spinner-border-sm me-2" aria-hidden="true"></span>
            Sign In
          </button>
        </form>

        <p class="mt-3 mb-0 text-center">
          Don't have an account?
          <a routerLink="/register">Register</a>
        </p>
      </div>
    </div>
  </div>
</div>
