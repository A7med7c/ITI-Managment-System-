<div class="d-flex justify-content-between align-items-center mb-3">
  <h2 class="h4 mb-0">{{ isEditMode ? 'Edit Student' : 'Add Student' }}</h2>
</div>

<div *ngIf="errorMessage" class="alert alert-danger" role="alert">
  {{ errorMessage }}
</div>

<div *ngIf="successMessage" class="alert alert-success" role="alert">
  {{ successMessage }}
</div>

<div *ngIf="loading" class="text-center py-4">
  <div class="spinner-border" role="status" aria-hidden="true"></div>
</div>

<div *ngIf="!loading" class="card">
  <div class="card-body">
    <form [formGroup]="form" (ngSubmit)="onSubmit()" novalidate>
      <div class="row g-3">
        <div class="col-12 col-md-6">
          <label for="stFname" class="form-label">First Name</label>
          <input id="stFname" type="text" class="form-control" formControlName="stFname" />
          <div *ngIf="form.controls.stFname.touched && form.controls.stFname.invalid" class="text-danger small mt-1">
            First name is required.
          </div>
        </div>

        <div class="col-12 col-md-6">
          <label for="stLname" class="form-label">Last Name</label>
          <input id="stLname" type="text" class="form-control" formControlName="stLname" />
          <div *ngIf="form.controls.stLname.touched && form.controls.stLname.invalid" class="text-danger small mt-1">
            Last name is required.
          </div>
        </div>

        <div class="col-12 col-md-6">
          <label for="stAddress" class="form-label">Address</label>
          <input id="stAddress" type="text" class="form-control" formControlName="stAddress" />
          <div *ngIf="form.controls.stAddress.touched && form.controls.stAddress.invalid"
            class="text-danger small mt-1">
            Address is required.
          </div>
        </div>

        <div class="col-12 col-md-6">
          <label for="stAge" class="form-label">Age</label>
          <input id="stAge" type="number" class="form-control" formControlName="stAge" />
          <div *ngIf="form.controls.stAge.touched && form.controls.stAge.invalid" class="text-danger small mt-1">
            Age must be greater than 0.
          </div>
        </div>

        <div class="col-12 col-md-6">
          <label for="deptId" class="form-label">Department</label>
          <select id="deptId" class="form-select" formControlName="deptId">
            <option [ngValue]="null">Select department</option>
            <option *ngFor="let department of departments" [ngValue]="department.deptId">
              {{ department.deptName }}
            </option>
          </select>
          <div *ngIf="form.controls.deptId.touched && form.controls.deptId.invalid" class="text-danger small mt-1">
            Department is required.
          </div>
        </div>
      </div>

      <div class="mt-4 d-flex gap-2">
        <button class="btn btn-primary" type="submit">{{ isEditMode ? 'Update' : 'Create' }}</button>
        <button class="btn btn-secondary" type="button" (click)="onCancel()">Cancel</button>
      </div>
    </form>
  </div>
</div>
